[package]
name = "gili"
version = "4.0.2"
description = "Gili Island for Windows"
authors = ["Faiz Anak Telkom University"]
edition = "2021"
default-run = "gili"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gili_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.58.0"
windows = { version = "0.58.0", features = ["implement", "Media_Control", "UI_Notifications", "UI_Notifications_Management", "Foundation", "Foundation_Collections", "ApplicationModel", "Win32_System_Com", "Storage_Streams", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_MediaFoundation", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Storage_FileSystem", "Data_Xml_Dom", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem", "ApplicationModel_DataTransfer", "Media_Ocr", "Graphics_Imaging", "Storage", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Memory", "Win32_Security", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Devices_Radios", "Networking_Connectivity", "Networking_NetworkOperators"] }
base64 = "0.22"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-store = "2.5.0"
tauri-plugin-updater = "2.13.1"
wmi = "0.18.4"
windows-registry = "0.100.0"
winreg = "0.56.0"
image = "0.25.10"
tauri-plugin-drag = "2.1.1"
ureq = { version = "2.10", default-features = true }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
